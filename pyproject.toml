[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscope"
version = "0.2.0"
description = "Audio-input oscilloscope for Linux, Windows and macOS: any device, rate or channel count, with triggering, cursors and measurements"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stanislav Ruzani", email = "stanislav.ruzani@gmail.com" }]
requires-python = ">=3.9"
keywords = ["oscilloscope", "audio", "alsa", "portaudio", "scope", "pyqtgraph"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21",
    "pyqtgraph>=0.13",
    "PySide6>=6.4",
    # PortAudio backend: binary wheels everywhere, nothing to compile.
    "sounddevice>=0.4",
]

[project.optional-dependencies]
# Direct ALSA access (hardware sample formats, hw: devices). Linux only, and
# compiled against the ALSA headers at install time.
alsa = ["pyalsaaudio>=0.9; sys_platform == 'linux'"]
dev = ["pytest>=7"]

[project.scripts]
pyscope = "pyscope.__main__:main"

[project.urls]
Homepage = "https://github.com/stanleyyyy/pyscope"
Issues = "https://github.com/stanleyyyy/pyscope/issues"

[tool.setuptools.packages.find]
include = ["pyscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
